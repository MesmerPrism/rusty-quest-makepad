[package]
name = "rusty-quest-makepad-camera-apk"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Clean Rusty Quest Makepad camera APK route for Quest hardware-buffer validation."
repository = "https://github.com/MesmerPrism/rusty-quest-makepad"
build = "build.rs"

[features]
default = []
makepad-hwb-ycbcr-metadata = []

[dependencies]
rusty-quest-camera-model = { path = "support/rusty-quest-camera-model" }
rusty-quest-projection-runtime-config = { path = "../../../rusty-quest/crates/rusty-quest-projection-runtime-config" }
rusty-quest-makepad-xr = { package = "makepad-xr", git = "https://github.com/MesmerPrism/makepad.git", rev = "c74a9659bd5cd92d9bd9b6f3627c24a893444354", version = "1.0.0" }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"
